# Example config for ticket-work.
# Location: ~/.config/ticket-work/config.yaml (respects XDG_CONFIG_HOME); drop-ins in config.d/*.yaml merge in
# lexical order after it. Every key below is shown with its default unless noted.
# Durations are strings such as 30m, 24h, 7d (units ms, s, m, h, d, w).
# Environment: scalars can be set as TICKET_WORK_<KEY>, nested keys joined with __ (TICKET_WORK_AGENT__MODE).
# Structured config (boards, hooks, rules) cannot be set from the environment.
# Status names, repository ids and sites below are placeholders: ticket-work ships no status names.

me:
  name: sam                       # actor name; default: the OS user name
instance: laptop                  # part of the claim holder ticket-work:<instance>; default: the sanitized hostname

# A board maps a ticketctl site to repositories and a status map. ticket-work boards are matched to
# ticket-queue boards by site and the ticket's facts, never by name.
boards:
  main:
    site: example                 # required: the ticketctl site
    repos:                        # required: ordered rules, the first match wins; an empty match is the board default
      - match:                    # keys: component, label, project, epic, issue_type (all optional, ANDed)
          issue_type: Bug
        repo: host/org/repo       # a repository id that wtctl locate can resolve
        base: main
      - match: {}
        repo: host/org/repo
        base: main
    branch:
      types:                      # branch type by issue type; default: {default: feat}
        default: feat
        Bug: fix
    preconditions:                # named checks from a closed set; default: []
      - {name: estimated, check: has_estimate}
      - {name: not-blocked, check: not_blocked}
      - {name: has-parent, check: has_parent}
      - {name: startable, check: status_in, values: ["To Do", "Ready"]}
      - {name: mine-or-free, check: assignee, value: me}       # me, none or any
      - {name: in-sprint, check: in_sprint, value: open}       # open or any
      - {name: not-held, check: labels_absent, values: ["on-hold"]}
    status_map:                   # event rules; default: {} (started is required to start a ticket)
      started:                    # events: started, pr_opened, pr_ready, pr_merged, pr_closed_unmerged, agent_blocked, agent_failed, stopped
        to: In Progress           # required: target status name
        from: ["To Do", "Ready"]  # required for started: the statuses the live ticket must be in
        assign: me                # started only: me, none or an account id
        sprint: open              # started only: open, next or a numeric sprint id
        confirm: ask              # ask (default; falls back to defaults.confirm), auto or never
        comment: false            # true posts one fixed-text comment per event
      pr_opened:
        to: In Review
        from: ["In Progress"]
      pr_merged:
        to: Done
        resolution: Done          # required when the target is a done status
        confirm: ask
    link_comment: false           # comment on pr_opened (applies to the pr_opened event)

defaults:
  confirm: ask                    # default for a rule's confirm: ask, auto or never

start:
  max_pending: 1                  # unresolved pending starts allowed under start --auto

pending:
  start_expiry: 24h               # pending start lifetime
  expiry: 7d                      # lifetime of other pending confirmations

claim:
  ttl: null                       # passed with --ttl when set; default: ticket-queue's own default
  renew_below: 0.5                # renew when this fraction of the TTL remains
  orphan_after: 15m               # release a holder's claim that has no work item

sync:
  overlap: 1h                     # discovery watermark overlap
  reread_open_after: 1h           # re-read open pull requests at least this often
  pr_idle_after: 14d              # pr_idle threshold

pr_watch:
  enabled: false                  # use pr-watch events as an early trigger

agent:
  skill: ticket-work:implement-ticket   # the implement-ticket slot skill
  mode: interactive               # interactive or headless
  sandbox: "off"                  # off, preferred or required (quoted: a bare off is a YAML boolean)
  permission_profile: null        # path; replaces the bundled permission profile
  setting_sources: [project]      # Claude setting sources: user, project, local
  env_allowlist: []               # --env-allowlist-only names
  plugin_dirs: []                 # extra plugin directories
  model: null                     # passed with --model when set

jobs:
  enabled: true                   # use jobsctl
  queue: tickets                  # jobsctl queue
  pass_env: []                    # --pass-env names (credentials come from jobsctl's env file)
  kill_grace: 120s                # --kill-grace
  max_running: 3                  # cap without jobsctl

cleanup:
  teardown: true                  # tear down after pr_merged

restore_on_failure: true          # run the restore flow when a start fails after a step landed

retention:
  work: 90d                       # prune age for finished work items
  pending: 30d                    # prune age for resolved pending records

# Hook lists (design guide section 8). Each entry: cmd, timeout (seconds or duration, default 30), async (default false).
# Hook names: pre-enqueue, pre-transition, pre-launch, post-link, post-status, post-start-failed, post-pending, post-attention.
hooks:
  pre-enqueue: []
  pre-transition: []
  pre-launch: []
  post-link: []
  post-status: []
  post-start-failed: []
  post-pending: []
  post-attention: []

# Executable path per sibling tool; default: the tool's own name on PATH.
tools:
  ticketctl: ticketctl
  ticket-queue: ticket-queue
  forgectl: forgectl
  agent-spawn: agent-spawn
  jobsctl: jobsctl
  wtctl: wtctl
  pr-watch: pr-watch

# Per-repository overrides, keyed by repository id; they take precedence over the environment and the global config.
repos:
  host/org/repo:
    agent:
      mode: interactive
    cleanup:
      teardown: true
    restore_on_failure: true
